name: fitx
description: FitX - AI-powered gym & fitness tracker (Flutter)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Local persistence
  shared_preferences: ^2.3.4

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.7

  # Charts (Progress screen)
  fl_chart: ^0.70.0

  # Sharing & Export
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  pdf: ^3.11.1

  # AI (Gemini)
  google_generative_ai: ^0.4.6

  # Unique IDs
  uuid: ^4.5.1

  # Notifications (Rest Timer)
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
